function bastParse_(ket) {
  let t = String(ket || ''), o = { tahun: '', noMesin: '', noRangka: '', sisa: t };
  const take = (re, key) => { const m = t.match(re); if (m) { o[key] = String(m[1]).trim(); t = t.replace(m[0], ' '); } };
  take(/(?:\b(?:no\.?|nomor)\s*)?\b(?:rangka|noka|chassis|chasis|vin)\b\s*[:=\-]?\s*([A-Za-z0-9\-]{6,})/i, 'noRangka');
  take(/(?:\b(?:no\.?|nomor)\s*)?\b(?:mesin|nosin|engine)\b\s*[:=\-]?\s*([A-Za-z0-9\-]{4,})/i, 'noMesin');
  take(/\b(?:tahun|thn|th)\b\.?\s*(?:kendaraan|pembuatan|produksi)?\s*[:=\-]?\s*((?:19|20)\d{2})\b/i, 'tahun');
  if (!o.noRangka) take(/\b([A-HJ-NPR-Z0-9]{17})\b/, 'noRangka');
  if (!o.tahun) take(/(?:^|[\s;,(])((?:19|20)\d{2})(?=$|[\s;,)])/, 'tahun');
  o.sisa = t.replace(/\s*[;,]\s*(?=[;,]|$)/g, '').replace(/^[\s;,]+|[\s;,]+$/g, '').replace(/\s{2,}/g, ' ').replace(/\s*;\s*;/g, ';').trim();

}

async function prep_(k, o, id) {
  const norm = v => String(v == null ? '' : v).trim().toLowerCase().replace(/\s+/g, ' ');
  const others = async () => (await read_(k)).filter(x => x.id !== id);
  if (k === 'invoice') {
    const hs = Number(o.hargaSewa) || 0, pp = Number(o.ppn) > 0 ? Number(o.ppn) : 11;
    if (hs > 0 && !(Number(o.nilai) > 0)) o.nilai = hs + Math.round(hs * pp / 100);
    if (!(Number(o.ppn) > 0)) o.ppn = 11;
  }
  if (k === 'po') {
    o.jenis = /untuk (Client|Supplier)/.test(o.jenis || '') ? 'PO untuk Supplier' : 'PO dari Client';
    if (!(Number(o.nilai) > 0) && Number(o.qty) > 0 && Number(o.harga) > 0) { const sb_ = Number(o.qty) * Number(o.harga); o.nilai = sb_ + (o.ppn === 'Ditambahkan' ? Math.round(sb_ * 0.11) : 0) - (o.pph === 'Dipotong' ? Math.round(sb_ * 0.02) : 0); }
    if ((await others()).some(x => norm(x.client) === norm(o.client) && norm(x.noPo) === norm(o.noPo))) throw new Error('No. PO "' + o.noPo + '" sudah tercatat untuk client ini.');
    if (!['Draft', 'Diajukan', 'Disetujui', 'Diproses', 'Selesai', 'Dibatalkan'].includes(o.status)) o.status = 'Diajukan';
  } else if (k === 'bast') {
    const p = bastParse_(o.keterangan); let ch = false;
    ['tahun', 'noMesin', 'noRangka'].forEach(f => { if (p[f] && !String(o[f] || '').trim()) { o[f] = p[f]; ch = true; } });
    if (ch) o.keterangan = p.sisa;
  } else if (k === 'penawaran') {
    if (!(Number(o.nilai) > 0) && Number(o.qty) > 0 && Number(o.harga) > 0) o.nilai = Number(o.qty) * Number(o.harga);
    if ((await others()).some(x => norm(x.client) === norm(o.client) && norm(x.noPenawaran) === norm(o.noPenawaran))) throw new Error('No. Penawaran "' + o.noPenawaran + '" sudah tercatat untuk client ini.');
    if (!['Draft', 'Terkirim', 'Disetujui', 'Ditolak', 'Kedaluwarsa', 'Dibatalkan'].includes(o.status)) o.status = 'Draft';
  } else if (k === 'kontrak') {
    const a = toIso_(o.tglMulai), b = toIso_(o.tglAkhir);
    if (!a || !b) throw new Error('Tanggal mulai dan tanggal berakhir kontrak wajib diisi.');
    if (b < a) throw new Error('Tanggal berakhir tidak boleh lebih awal dari tanggal mulai.');
    if ((await others()).some(x => norm(x.client) === norm(o.client) && norm(x.noKontrak) === norm(o.noKontrak))) throw new Error('No. Kontrak "' + o.noKontrak + '" sudah tercatat untuk client ini.');
    o.statusManual = o.statusManual === 'Dibatalkan' ? 'Dibatalkan' : '';
  } else if (k === 'kategori') {
    if ((await others()).some(x => norm(x.nama) === norm(o.nama))) throw new Error('Kategori "' + o.nama + '" sudah ada.');
    if (o.status !== 'Nonaktif') o.status = 'Aktif';
  } else if (k === 'pemasukan') {
    const dt = toIso_(o.tanggal);
    if (!dt) throw new Error('Format tanggal salah: Tanggal pemasukan.');
    o.status = o.status === 'Dibatalkan' ? 'Dibatalkan' : 'Valid';
    const ks = await read_('kategori');
    if (ks.length && !ks.some(x => norm(x.nama) === norm(o.kategori))) throw new Error('Kategori "' + o.kategori + '" belum ada. Tambahkan dulu di Master Data > Kategori Pemasukan.');
    if (o.status === 'Valid') {
      const live = (await others()).filter(x => x.status !== 'Dibatalkan'), ref = norm(o.noRef);
      if (ref && live.some(x => norm(x.noRef) === ref)) throw new Error('Nomor referensi "' + o.noRef + '" sudah dipakai transaksi lain. Kemungkinan input ganda.');
      if (!ref && live.some(x => x.tanggal === dt && Number(x.nominal) === Number(o.nominal) && norm(x.kategori) === norm(o.kategori) && norm(x.client) === norm(o.client) && norm(x.sumber) === norm(o.sumber))) throw new Error('Transaksi dengan tanggal, sumber, kategori, client, dan nominal yang sama sudah ada. Isi Nomor Referensi kalau ini memang transaksi berbeda.');
    }
  } else if (k === 'ccf') {
    const cl = String(o.client).trim(), dt = toIso_(o.date), demob = /^demob/i.test(String(o.tipe || '').trim());
    if (!dt) throw new Error('Format tanggal salah: Tanggal mobilisasi / demobilisasi.');

    const cands = drivers.filter(d => normNama_(d.name) === nn), d = cands.find(x => String(x.client).trim() === cl) || cands[0];
    if (!d) throw new Error('Driver "' + o.name + '" belum ada di Driver Master. Tambahkan dulu di Master Data > Driver Master.');
    o.name = d.name; o.driverId = d.id;
    if (!String(o.ptsId || '').trim()) o.ptsId = d.ptsId;
    let plat = String(o.plat || '').trim();
    if (!plat && !demob) plat = unitTetapFor_(o.name, cl, await unitTetapRank_(), units);
    if (plat) {
      const pn = v => String(v).toLowerCase().replace(/\s+/g, '');
      const u = units.find(x => pn(x.plat) === pn(plat) && String(x.client).trim() === cl);
      if (!u) { o.plat = plat; o.unitId = ''; } // plat isi manual (belum ada di Master Unit client ini) tetap diterima
      else {

    }
    o.shift = /^m/i.test(String(o.shift || '').trim()) ? 'Malam' : /^s/i.test(String(o.shift || '').trim()) ? 'Siang' : '';

    if (!String(o.departure || '').trim()) o.departure = demob ? 'Suban' : 'Macang Sakti';
    if (!String(o.jobTitle || '').trim()) o.jobTitle = 'Driver';

    const c = await me_(); if (c.tabs.indexOf('drivers') < 0) throw denied();
    const rows = must(await sb.from('drivers').select('id,roster_day,status').in('id', [idA, idB]));
    const a = (rows || []).find(r => r.id === idA), b = (rows || []).find(r => r.id === idB);
    if (!a || !b) return { success: false, message: 'Driver tidak ditemukan.' };
    must(await sb.from('drivers').update({ roster_day: b.roster_day, status: b.status }).eq('id', idA).select('id'));
    must(await sb.from('drivers').update({ roster_day: a.roster_day, status: a.status }).eq('id', idB).select('id'));
    return { success: true, message: 'Swap roster berhasil.' };
  },

  async historyOf(k, id) {
    const c = await me_(), t = TBL[k];
    if (!t) throw new Error('Tabel tidak dikenal.');
    if (c.tabs.indexOf(k) < 0) throw denied();
    const rows = must(await sb.from('audit_log').select('waktu,user_email,aksi,detail').eq('tabel', t.table).eq('id_data', id).order('waktu', { ascending: false }).limit(50));
    return (rows || []).map(r => ({ waktu: fmtTs(r.waktu), user: r.user_email || 'sistem', aksi: r.aksi, detail: detailTxt(r.detail, r.aksi) }));
  },

  async saveSettings(o) {
    const c = await me_(); if (c.role !== 'creator') throw denied();
    const num = ['TARIF_CALLOUT', 'TARIF_OVERTIME', 'ROSTER_ON_DAYS', 'ROSTER_OFF_DAYS', 'ALERT_DAYS'], rows = [];
    Object.keys(DEFAULTS).forEach(k => {
      if (!(k in o)) return;
      let v = String(o[k] == null ? '' : o[k]).trim();
      if (num.indexOf(k) >= 0) {
        const x = Number(v);
        if (v === '' || isNaN(x) || x < 0) throw new Error('Angka tidak valid: ' + k);
        if ((k === 'ROSTER_ON_DAYS' || k === 'ROSTER_OFF_DAYS') && x < 1) throw new Error('Lama roster minimal 1 hari.');
        v = String(x);
      } else {
        if (k === 'COMPANY_NAME' && !v) throw new Error('Nama perusahaan wajib diisi.');
        if ((k === 'ALERT_EMAIL' || k === 'BACKUP_EMAIL') && v && !v.split(',').every(e => EMAIL_RE.test(e.trim()))) throw new Error('Format ' + k + ' tidak valid.');
        if (k === 'BOSS_WA' && v && !v.split(',').every(n => waNum_(n))) throw new Error('Nomor WA Bos tidak valid. Contoh: 081234567890 (pisahkan dengan koma kalau lebih dari satu).');
        if (k === 'AUTO_HARIAN' && v !== 'Ya' && v !== 'Tidak') throw new Error('Pengaturan input harian otomatis harus Ya atau Tidak.');
        if (k === 'AUTO_HARIAN_MULAI' && v) { v = toIso_(v); if (!v) throw new Error('Tanggal mulai input harian otomatis tidak valid.'); }
      }
      rows.push({ key: k, value: v });
    });
    must(await sb.from('settings').upsert(rows, { onConflict: 'key' }));
    return { success: true, message: 'Pengaturan disimpan.' };
  },

  async uploadAttachment(k, id, name, b64) {
    const c = await me_();
    if (ATT_TABLES.indexOf(k) < 0) throw new Error('Lampiran tidak tersedia untuk menu ini.');
    if (c.tabs.indexOf(k) < 0) throw denied();
    const t = TBL[k], raw = must(await sb.from(t.table).select('*').eq('id', id).maybeSingle());
    if (!raw) throw new Error('Data induk tidak ditemukan.');
    const rec = fromDb(k, raw), clean = String(name || '').replace(/[\\\/:*?"<>|\x00-\x1f]+/g, '-').trim().slice(0, 120), ext = (clean.split('.').pop() || '').toLowerCase();
    if (!clean || !(ext in ATT_EXT)) throw new Error('Tipe file tidak didukung. Boleh: PDF, PNG, JPG, DOC/DOCX, XLS/XLSX.');
    const cfg = ATT_CFG[k];
    if (cfg.only && cfg.only.indexOf(ext) < 0) throw new Error('Untuk menu ini hanya boleh file: ' + cfg.only.join(', ').toUpperCase() + '.');
    const bytes = b64ToBytes(b64 || '');
    if (!bytes.length) throw new Error('File kosong.');
    if (bytes.length > 10 * 1024 * 1024) throw new Error('Ukuran file maksimal 10 MB.');
    if (!sigOk_(ext, bytes)) throw new Error('Isi file tidak sesuai dengan ekstensinya (' + ext + ').');
    const parts = [cfg.dir]; if (cfg.sub) parts.push(cfg.sub(rec)); if (cfg.tree) parts.push(safeName_(rec.client) || 'Tanpa Client'); if (cfg.tree === 'period') parts.push(cfg.period(rec));
    const dir = parts.map(seg_).join('/'), base = attBase_(k, rec);
    let nm = '', path = '', done = false;
    for (let n = 1; n <= 30 && !done; n++) {
      nm = base + (n > 1 ? '_' + n : '') + '.' + ext; path = dir + '/' + seg_(nm);
      const up = await sb.storage.from('lampiran').upload(path, new Blob([bytes], { type: ATT_EXT[ext] }), { contentType: ATT_EXT[ext], upsert: false });
      if (!up.error) done = true; else if (!/already exists|duplicate|409/i.test(String(up.error.message || '') + String(up.error.statusCode || ''))) fail(up.error);
    }
    if (!done) throw new Error('Gagal menyimpan file (nama bentrok).');
    const aid = 'ATT-' + uid8();
    must(await sb.from('lampiran').insert({ id: aid, tabel: k, id_data: id, nama_file: nm, storage_path: path, mime: ATT_EXT[ext], ukuran: bytes.length, oleh: c.email }));
    return { success: true, id: aid, message: 'File "' + nm + '" tersimpan: ' + dir };
  },
  async downloadAttachment(attId) {
    await me_();

    if (!a) throw new Error('File tidak ditemukan.');
    const r = await sb.storage.from('lampiran').download(a.storage_path);
    if (r.error) throw new Error('File sudah tidak ada di penyimpanan.');
    return { name: a.nama_file, mime: a.mime || 'application/octet-stream', b64: bytesToB64(await r.data.arrayBuffer()) };
  },
  async deleteAttachment(attId) {

  async requestPasswordChange(oldPw, newPw) {
    if (!pwOk_(newPw)) throw new Error(PW_MSG);

      const efektif = userTabs_(u);
      return { email: p.email, role: p.role, akses: u.akses, aksesCustom: u.aksesCustom, hapus: u.hapus, efektif: efektif,
        bisaHapus: p.role === 'creator' || (u.hapus === 'Ya' ? true : u.hapus === 'Tidak' ? false : p.role === 'manager'),

  async userAdmin(action, email, arg) {
    const c = await me_(); if (c.role !== 'creator') throw denied();
    const e = String(email || '').trim().toLowerCase();
    const aks = (list, role) => Array.isArray(list) ? list.map(String).filter((k, i, a) => ASSIGNABLE.indexOf(k) >= 0 && a.indexOf(k) === i) : (role === 'staff' ? [] : null);
    if (action === 'add') {
      if (!EMAIL_RE.test(e)) throw new Error('Format email tidak valid.');
      const role = String(arg && arg.role);
      if (role !== 'manager' && role !== 'admin' && role !== 'staff') throw new Error('Peran harus manager, admin, atau staf.');
      const r = await sb.rpc('app_add_user', { p_email: e, p_role: role, p_akses: aks(arg.akses, role), p_hapus: arg.hapus === 'Ya' || arg.hapus === 'Tidak' ? arg.hapus : null, p_preview: arg.preview === 'Ya' });
      if (r.error) throw new Error(/belum dibuat/i.test(r.error.message) ? r.error.message : friendly(r.error));
      return { success: true, message: 'Pengguna ' + e + ' ditambahkan sebagai ' + role + '.' };
    }
    const p = must(await sb.from('profiles').select('*').eq('email', e).maybeSingle());
    if (!p) throw new Error('Pengguna tidak ditemukan.');
    const upd = async (patch, msg) => { const d = must(await sb.from('profiles').update(patch).eq('email', e).select('id')); if (!d || !d.length) throw denied(); return { success: true, message: msg }; };
    if (action === 'role') { if (p.role === 'creator') throw new Error('Peran creator tidak bisa diubah.'); if (arg !== 'manager' && arg !== 'admin' && arg !== 'staff') throw new Error('Peran harus manager, admin, atau staf.'); return upd({ role: arg }, 'Peran ' + e + ' menjadi ' + arg + '.'); }
    if (action === 'akses') { if (p.role === 'creator') throw new Error('Creator selalu memegang semua fitur.'); return upd({ akses: aks(arg && arg.akses, p.role), boleh_hapus: arg && (arg.hapus === 'Ya' || arg.hapus === 'Tidak') ? arg.hapus : null, preview_slip: !!(arg && arg.preview === 'Ya') }, 'Akses ' + e + ' disimpan. Berlaku saat dia memuat ulang halaman.'); }
    if (action === 'aktif') { if (p.role === 'creator') throw new Error('Akun creator tidak bisa dinonaktifkan.'); return upd({ aktif: !!arg }, 'Akun ' + e + (arg ? ' diaktifkan.' : ' dinonaktifkan.')); }
    if (action === 'delete') {
      if (p.role === 'creator') throw new Error('Akun creator tidak bisa dihapus.');
      const d = must(await sb.from('profiles').delete().eq('email', e).select('id')); if (!d || !d.length) throw denied();
      return { success: true, message: 'Pengguna ' + e + ' dihapus dari dashboard. (Akun login-nya masih ada di Supabase > Authentication > Users; hapus di sana kalau perlu.)' };
    }
    if (action === 'reset') throw new Error('Reset password dilakukan di Supabase > Authentication > Users (menu titik tiga pada pengguna), lalu pilih Send password recovery.');
    throw new Error('Aksi ini belum tersedia di versi Supabase.');
  },

  async previewSlipPdf(id) {
    const c = await me_(); if (!c.canPrev) throw new Error('Akses ditolak. Preview PDF slip hanya untuk akun yang diizinkan creator.');
    const cfg = await settings_(), raw = must(await sb.from('slip').select('*').eq('id', id).maybeSingle());

  async switchAccount(email) {

    const r = await callFn_('pindah-akun', { action: 'switch', email: email, ot: otGet_() });

  }

function openModal(title, html, submit) {
  $('mt').textContent = title;
  $('mb').innerHTML = html;
  formPolish();
  $('mErr').style.display = 'none';
  $('modal').classList.remove('hidden');
  $('ms').classList.remove('hidden');
  $('mf').noValidate = true;
  $('mf').oninput = e => { const l = e.target.closest && e.target.closest('label'); if (l) { l.querySelectorAll('.ferr').forEach(x => x.remove()); e.target.classList.remove('ferr-in'); } };
  $('mf').onsubmit = async e => {
    e.preventDefault();
    $('mErr').style.display = 'none';
    document.querySelectorAll('#mf .ferr').forEach(x => x.remove());
    document.querySelectorAll('#mf .ferr-in').forEach(x => x.classList.remove('ferr-in'));
    const bad = [...$('mf').querySelectorAll('[required]')].filter(el => !String(el.value || '').trim());
    if (bad.length) {
      bad.forEach(el => { const l = el.closest('label'); if (!l) return; el.classList.add('ferr-in'); if (el.type === 'date' && el.parentElement) el.parentElement.firstElementChild.classList.add('ferr-in'); l.insertAdjacentHTML('beforeend', '<p class="ferr">Wajib diisi.</p>'); });
      const f = bad[0]; try { f.closest('label').scrollIntoView({ block: 'center', behavior: 'smooth' }); if (f.type !== 'date') f.focus({ preventScroll: true }); } catch (x) { }
      return;
    }
    setBusy($('ms'), true, 'Memproses...');
    try { await submit(Object.fromEntries(new FormData($('mf')))); }
    catch (err) { const m = err.message || String(err); $('mErr').textContent = m; $('mErr').style.display = 'block'; toast(m, true); try { $('mErr').scrollIntoView({ block: 'nearest' }); } catch (x) { } }
    finally { setBusy($('ms'), false); }
  };
}

const normNama = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
// Departure CCF = nama tempat singkat dari alamat KTP (Identitas): Desa/Kelurahan, kalau tidak ada Kota/Kabupaten, kalau tidak ada Kecamatan
function shortAlamat(alamat) {
  const s = String(alamat || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const stop = '(?=\\s*(?:[,;.\\d]|\\b(?:kec|kecamatan|kab|kabupaten|kota|kel|kelurahan|desa|ds|dusun|dsn|rt|rw|prov|provinsi|no)\\b|$))';
  const pick = kw => { const m = s.match(new RegExp('(?:^|[\\s,.])(?:' + kw + ')(?:\\.\\s*|:\\s*|\\s+)([A-Za-z][A-Za-z\\s\'-]*?)' + stop, 'i')); return m ? m[1].trim() : ''; };
  let v = pick('kelurahan|desa|kel|ds') || pick('kabupaten|kota|kab') || pick('kecamatan|kec');
  if (!v) v = s.split(/[,;]/).map(x => x.replace(/\b(jl|jalan|dusun|dsn|rt|rw|no)\b\.?\s*[\w\/.-]*/ig, '').trim()).filter(x => /[A-Za-z]/.test(x))[0] || '';
  return v.toLowerCase().replace(/(^|[\s'-])([a-z])/g, (m, a, b) => a + b.toUpperCase()).trim();
}

async function impLampiranUi() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true; inp.accept = '.pdf,.jpg,.jpeg,.png';
  inp.onchange = async () => {
    const files = Array.from(inp.files || []); if (!files.length) return;
    const byName = {}; IMP_MANIFEST.forEach(m => { byName[m[0]] = m; });
    const total = {}; IMP_MANIFEST.forEach(m => { const k = m[1] + '|' + m[2]; total[k] = (total[k] || 0) + 1; });
    const have = k => (DB.lampiran || []).filter(a => a.tabel + '|' + a.idData === k).length;
    const ok = [], skip = [], bad = [], unk = [];
    toast('Mengimpor ' + files.length + ' file, mohon tunggu...');
    for (const f of files) {
      const m = byName[f.name];
      if (!m) { unk.push(f.name); continue; }
      const key = m[1] + '|' + m[2];
      if (have(key) >= total[key]) { skip.push(f.name); continue; }
      try {
        const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('Gagal membaca file')); r.readAsDataURL(f); });
        const r = await call('uploadAttachment', m[1], m[2], f.name, b64);
        if (r && r.success !== false) { ok.push(f.name); DB.lampiran = (DB.lampiran || []).concat([{ tabel: m[1], idData: m[2] }]); } else bad.push(f.name + ': ' + ((r && r.message) || 'gagal'));
      } catch (e) { bad.push(f.name + ': ' + (e.message || e)); }
    }
    const msg = 'Impor selesai: ' + ok.length + ' berhasil' + (skip.length ? ', ' + skip.length + ' sudah ada (dilewati)' : '') + (unk.length ? ', ' + unk.length + ' file tidak dikenali' : '') + (bad.length ? ', ' + bad.length + ' GAGAL' : '') + '.';
    toast(msg, bad.length > 0);
    if (bad.length) alert(msg + '\n\n' + bad.join('\n'));
    if (unk.length) console.log('File tidak dikenali:', unk);
    BK_CACHE = null; await load();
  };
  inp.click();
}

  g('btnPeriode').onclick = e => { e.stopPropagation(); setPeriod(!perOpen); };
  document.addEventListener('click', e => { if (perOpen && !e.target.closest('#dateWrap')) setPeriod(false); });
  g('dp').addEventListener('change', () => { if (g('dp').value !== 'kustom') setPeriod(false); });
  const openSheet = o => { g('filtBody').classList.toggle('open', o); g('filtBack').classList.toggle('hidden', !o); g('btnFilt').setAttribute('aria-expanded', String(o)); document.body.style.overflow = o ? 'hidden' : ''; };
  g('btnFilt').onclick = () => openSheet(true);
  ['filtBack', 'btnFiltX', 'btnApply'].forEach(id => { g(id).onclick = () => openSheet(false); });
  document.addEventListener('click', e => { const r = e.target.closest('[data-reset]'); if (r) window.resetFilters(); });
  const filterUi = () => {
    const dated = visible('dates');
    g('dates').dataset.dated = dated ? '1' : '0';
    g('btnPeriode').classList.toggle('on', dated);
    const d1 = g('d1').value, d2 = g('d2').value, dp = g('dp'), o = dp.selectedOptions[0];
    g('periodeLbl').textContent = dp.value === 'kustom' ? ((d1 || d2) ? (fmtD(d1) || '...') + ' - ' + (fmtD(d2) || '...') : 'Kustom') : (o ? o.textContent : 'Periode');
    g('dates').classList.toggle('hidden', !(dated && (perOpen || !desk())));
    const n = filterCount();
    g('filtBadge').textContent = n; g('filtBadge').classList.toggle('hidden', !n);
    g('btnReset').classList.toggle('on', window.filterActive());
    g('btnFilt').classList.toggle('hidden', !visible('filters'));
  };
  window.uiAfterRender = function () {
    filterUi();
    const t = typeof curTab === 'function' ? curTab() : null;
    if (t) g('hdrTitle').textContent = t.l;
    if (DB && DB.email) {
      g('avatar').textContent = (DB.email[0] || '?').toUpperCase();
      g('roleChip').textContent = ROLE_LBL[DB.role] || DB.role || '';
    }
    g('expWrap').classList.toggle('hidden', !['btnPv', 'btnPdf', 'btnXls', 'btnCcf', 'btnCcfPv', 'btnSync', 'btnSlipTs', 'btnSlipPv', 'btnAll'].some(id => !g(id).classList.contains('hidden')));
    g('kpiSec').classList.toggle('hidden', !g('cards').children.length);
    applyKpi();
    // kolom rupiah rata kanan
    document.querySelectorAll('#view table').forEach(tb => {
      const ths = tb.querySelectorAll('thead tr:last-child th'), rows = [...tb.querySelectorAll('tbody tr')].filter(r => r.children.length === ths.length);
      ths.forEach((th, j) => {
        let n = 0, ok = true;
        rows.forEach(r => { const x = r.children[j].textContent.trim(); if (!x || x === '-') return; if (RP.test(x)) n++; else ok = false; });
        if (ok && n) { th.classList.add('text-right'); rows.forEach(r => r.children[j].classList.add('text-right', 'tabular-nums')); }
      });
    });
  };
  const _render = render;
  render = function () { const r = _render.apply(this, arguments); try { window.uiAfterRender(); } catch (e) { console.error(e); } return r; };
})();

/* ---------- UI tahap 2: beranda, navigasi cepat, tabel, tema ---------- */
(function () {
  const g = id => document.getElementById(id);
  const sget = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const sset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };
  // tema terang / gelap
  const applyTheme = () => { document.documentElement.classList.toggle('light', sget('jmm_theme') === 'light'); const b = g('btnTheme'); if (b) { const l = sget('jmm_theme') === 'light'; b.setAttribute('aria-label', l ? 'Pakai tema gelap' : 'Pakai tema terang'); b.title = b.getAttribute('aria-label'); b.innerHTML = ic(l ? 'moon' : 'sun', 'w-[18px] h-[18px]'); } };
  applyTheme();
  const flipTheme = () => { sset('jmm_theme', sget('jmm_theme') === 'light' ? 'dark' : 'light'); applyTheme(); };
  g('btnTheme').onclick = flipTheme; g('btnTheme2').onclick = flipTheme;

  // pencarian cepat (Ctrl+K)
  let palSel = 0, palItems = [];
  const palOpen = () => { g('pal').classList.remove('hidden'); g('palq').value = ''; palRender(); setTimeout(() => g('palq').focus(), 30); document.body.style.overflow = 'hidden'; };
  const palClose = () => { g('pal').classList.add('hidden'); document.body.style.overflow = ''; };
  const palRender = () => {
    const q = g('palq').value.toLowerCase().trim(), vis = visibleTabs(), items = [];
    vis.filter(t => !q || (t.l + ' ' + (t.t || '')).toLowerCase().includes(q)).slice(0, q ? 6 : 8).forEach(t => items.push({ g: 'Menu', ico: t.i || 'file', t: t.l, s: t.t || '', go: () => goTo(t.k) }));
    if (q.length >= 2) {
      const add = (grp, ico, tab, arr, tt, ss, key) => { if (!hasTab(tab)) return; arr.filter(r => key(r).toLowerCase().includes(q)).slice(0, 4).forEach(r => items.push({ g: grp, ico, t: tt(r), s: ss(r), go: () => { cur = tab; g('q').value = tt(r); render(); window.scrollTo(0, 0); } })); };
      add('Driver', 'users', 'drivers', DB.drivers || [], r => r.name, r => [r.client, r.ptsId].filter(Boolean).join(' · '), r => [r.name, r.ptsId, r.msid].join(' '));
      add('Unit', 'truck', 'units', DB.units || [], r => r.plat, r => r.client || '', r => r.plat || '');
      add('Invoice', 'card', 'invoice', DB.invoice || [], r => r.noInvoice, r => [r.client, rp(r.nilai)].filter(Boolean).join(' · '), r => [r.noInvoice, r.client].join(' '));
    }
    palItems = items; palSel = Math.min(palSel, Math.max(0, items.length - 1));
    let last = '';
    g('pall').innerHTML = items.length ? items.map((x, i) => { const hd = x.g !== last ? `<p class="pal-g">${x.g}</p>` : ''; last = x.g; return hd + `<button type="button" class="pal-i${i === palSel ? ' on' : ''}" data-pi="${i}">${ic(x.ico, 'w-4 h-4 flex-none')}<span class="min-w-0"><span class="block truncate">${esc(x.t)}</span>${x.s ? `<span class="block truncate text-[11px] text-slate-400">${esc(x.s)}</span>` : ''}</span></button>`; }).join('') : '<p class="p-4 text-sm text-slate-400">Tidak ada hasil.</p>';
  };
  const palRun = i => { const x = palItems[i]; if (!x) return; palClose(); x.go(); };
  g('palq').addEventListener('input', () => { palSel = 0; palRender(); });
  g('pall').addEventListener('click', e => { const b = e.target.closest('[data-pi]'); if (b) palRun(+b.dataset.pi); });
  g('pal').addEventListener('click', e => { if (e.target === g('pal')) palClose(); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); g('pal').classList.contains('hidden') ? palOpen() : palClose(); return; }
    if (g('pal').classList.contains('hidden')) return;
    if (e.key === 'Escape') palClose();
    else if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); palRender(); const el = g('pall').querySelector('.on'); if (el) el.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palRender(); const el = g('pall').querySelector('.on'); if (el) el.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter') { e.preventDefault(); palRun(palSel); }
  });
  document.addEventListener('click', e => {
    if (e.target.closest('[data-pal]')) { palOpen(); return; }
    if (e.target.closest('[data-menu-open]')) { g('btnMenu').click(); return; }
    const gh = e.target.closest('.nav-gh[data-gh]');
    if (gh) { const k = 'jmm_g_' + gh.dataset.gh; sset(k, sget(k) === '1' ? '0' : '1'); renderChrome(); }
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.nav-gh[data-gh]')) { e.preventDefault(); e.target.click(); } });

  // klik kartu beranda / item tindakan / tombol dalam tabel
  g('view').addEventListener('click', e => {
    if (e.target.closest('[data-eye]')) return;
    const b = e.target.closest('[data-bgo]');
    if (b) {
      const [tab, xf, val] = b.dataset.bgo.split('|');
      if (tab === 'scroll') { const el = g('todoBox'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      goTo(tab, xf, val); return;
    }
    const mb = e.target.closest('[data-more]');
    if (mb) { const box = mb.parentElement.querySelector('.more'); const o = box.classList.toggle('hidden'); mb.textContent = o ? 'Detail ▾' : 'Tutup ▴'; }
  });

  const GROUP_OF = k => { for (const [name, , , items] of MENUS) if (items.some(x => x[0] === k)) return name; return k === 'rekapgaji' || k === 'papan' ? 'Operasional' : k === 'rekaplaba' ? 'Keuangan & SDM' : k === 'beranda' ? 'Utama' : 'Sistem'; };
  const ICO = {
    'Ubah': 'pencil', 'Hapus': 'trash', 'Ganti status': 'refresh', 'Pratinjau': 'eye', 'Preview PDF': 'eye', 'Cetak PDF': 'printer', 'Detail': 'filelist', 'Lampiran': 'clip'
  };
  window.uiAfterRender2 = function () {
    document.body.dataset.cur = cur;
    const view = g('view'), isTbl = !!(view.firstElementChild && view.firstElementChild.tagName === 'TABLE');
    document.body.toggleAttribute('data-tbl', isTbl);
    // terakhir dibuka
    if (cur !== 'beranda') { let r = []; try { r = JSON.parse(sget('jmm_recent') || '[]'); } catch (e) { } if (r[0] !== cur) { r = [cur].concat(r.filter(x => x !== cur)).slice(0, 4); sset('jmm_recent', JSON.stringify(r)); } }
    // breadcrumb + tombol kembali
    const t = curTab(), cr = g('crumb');
    if (cr) { cr.innerHTML = cur === 'beranda' ? '' : `<button type="button" class="crumb-back md:hidden" data-k="beranda" aria-label="Kembali ke Beranda">‹ Beranda</button><span class="hidden md:inline"><button type="button" class="crumb-l" data-k="beranda">Beranda</button> › ${esc(GROUP_OF(cur))} › <b class="text-slate-200 font-medium">${esc(t.l)}</b></span>`; }
    // bottom bar
    document.querySelectorAll('#bnav [data-k]').forEach(b => { b.classList.toggle('on', b.dataset.k === cur); b.classList.toggle('hidden', !hasTab(b.dataset.k)); });
    // ikon pada kolom Aksi (tabel layar lebar); teks asli jadi tooltip
    view.querySelectorAll('table button[data-a]').forEach(b => {
      if (b.dataset.ico) return;
      const label = b.textContent.trim(), base = label.replace(/\s*\(\d+\)$/, ''), key = ICO[base]; if (!key) return;
      const cnt = (label.match(/\((\d+)\)$/) || [])[1];
      b.dataset.ico = '1'; b.title = label; b.setAttribute('aria-label', label); b.classList.add('ico-btn');
      b.innerHTML = ic(key, 'w-4 h-4') + (cnt ? `<span class="ico-n">${cnt}</span>` : '');
    });
    // label aksesibilitas untuk tombol tanpa teks
    document.querySelectorAll('button:not([aria-label])').forEach(b => { if (!b.textContent.trim() && b.title) b.setAttribute('aria-label', b.title); });
  };
  const _r2 = render;
  render = function () { const r = _r2.apply(this, arguments); try { window.uiAfterRender2(); } catch (e) { console.error(e); } return r; };
})();

setInterval(() => { $('clock').textContent = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date()) + ' WIB'; }, 1000);
// Data otomatis diperbarui tiap 60 detik (tidak mengganggu saat form / lampiran sedang dibuka)
setInterval(() => { if (!TOKEN || document.hidden) return; if (['modal', 'att', 'pv', 'bpv'].some(id => !$(id).classList.contains('hidden'))) return; load(); }, 60000);
// ---------- PWA: pasang aplikasi ke layar HP / komputer ----------
(function () {
  const btn = document.getElementById('btnInstall'); if (!btn) return;
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  let ev = null;
  if (standalone) return;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; btn.classList.remove('hidden'); });
  window.addEventListener('appinstalled', () => { ev = null; btn.classList.add('hidden'); });
  if (ios) btn.classList.remove('hidden');
  btn.onclick = async () => {
    if (ev) { ev.prompt(); try { await ev.userChoice; } catch (e) { /* abaikan */ } ev = null; btn.classList.add('hidden'); return; }
    if (ios) return alert('Cara memasang di iPhone/iPad:\n1. Buka halaman ini di Safari.\n2. Ketuk tombol Bagikan (kotak dengan panah ke atas).\n3. Pilih "Tambah ke Layar Utama", lalu Tambah.');
    alert('Buka menu browser (titik tiga di pojok kanan atas), lalu pilih "Instal aplikasi" atau "Tambahkan ke layar utama".');
  };
  if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();
window.onload = async () => { try { const s = await window.JMM_SB.auth.getSession(); if (s.data && s.data.session) { TOKEN = 'sb'; } } catch (e) { /* abaikan */ } load(); };
</script>
